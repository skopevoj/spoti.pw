name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      deb_url:
        description: 'Optional: URL to pre-built .deb (leave empty to build from source)'
        required: false
        default: ''
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        run: |
          mkdir -p ipa
          curl -fsSL "${{ inputs.ipa_url }}" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      # ── Path 1: Build from source (default) ─────────────────────
      - name: Build tweak from source
        if: ${{ inputs.deb_url == '' }}
        run: make release

      # ── Path 2: Use a pre-built .deb from a URL ─────────────────
      - name: Inject pre-built .deb into IPA
        if: ${{ inputs.deb_url != '' }}
        run: |
          echo "Downloading .deb from provided URL…"
          curl -fsSL "${{ inputs.deb_url }}" -o tweak.deb
          echo "Deb size: $(du -h tweak.deb | cut -f1)"

          # Inject the .deb into the IPA using cyan
          cyan -i ipa/spotify.ipa -o out/spoti.pw.ipa -w -u -c tweak.deb

          echo "✅ Built IPA using pre-built .deb"

      - name: List output
        run: |
          echo "Output files:"
          ls -la out/

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: spoti.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="spotifyglass-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
